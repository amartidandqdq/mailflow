# Configuration locale de production, chargée automatiquement avec compose.yaml.
services:
  backend:
    image: "ghcr.io/maathimself/mailflow-backend@sha256:d0a387d44b59c5697ffb59ad2bb3271764b8200e7c435dceedd561c7c63e5f67"
    environment:
      APP_URL: "https://mailflow.taild49e80.ts.net"
      FRONTEND_URL: "https://mailflow.taild49e80.ts.net"
    mem_limit: "2g"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    image: "ghcr.io/maathimself/mailflow-frontend@sha256:2eeab7f300b9fb724e674d7427ff600204eb96b171a407cb4716b337c0c8b761"
    environment:
      NGINX_TLS: "off"
    mem_limit: "256m"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: "postgres@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36"
    mem_limit: "2g"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: "redis@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541"
    mem_limit: "1g"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
