# Configuration locale de production, chargée automatiquement avec compose.yaml.
services:
  backend:
    image: "ghcr.io/maathimself/mailflow-backend@sha256:de6148fa1eff7c126b60a54133e8e939ac136f7888b7df72a8c620ee5d7d8e79"
    environment:
      APP_URL: "https://mailflow.taild49e80.ts.net"
      FRONTEND_URL: "https://mailflow.taild49e80.ts.net"
    mem_limit: "2g"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    image: "ghcr.io/maathimself/mailflow-frontend@sha256:9c4d84479aa0f11b7cc071d1e392357c067634806092e50e873c85990e95a4b0"
    environment:
      NGINX_TLS: "off"
    mem_limit: "256m"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    image: "postgres@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139"
    mem_limit: "2g"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: "redis@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b"
    mem_limit: "1g"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
